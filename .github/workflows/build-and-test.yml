name: build-and-test

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  simulation:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Restore simulation and tests
        run: dotnet restore Vivarium.sln
      - name: Camera collision fast check
        run: dotnet test tests/Vivarium.Sim.Tests/Vivarium.Sim.Tests.csproj --configuration Release --no-restore --filter FullyQualifiedName~CameraCollisionTests
      - name: Full simulation tests
        run: dotnet test Vivarium.sln --configuration Release --no-restore

  game-build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Restore Godot C# project
        run: dotnet restore game/Vivarium.csproj
      - name: Compile Godot C# project
        run: dotnet build game/Vivarium.csproj --configuration Release --no-restore
      - name: Fetch Godot 4.7.1 Mono
        run: |
          curl -L --fail --retry 3 -o godot.zip https://github.com/godotengine/godot-builds/releases/download/4.7.1-stable/Godot_v4.7.1-stable_mono_linux_x86_64.zip
          mkdir godot-bin
          unzip -q godot.zip -d godot-bin
          find godot-bin -type f -name 'Godot*' -maxdepth 3 -print
      - name: Headless project load
        run: |
          GODOT="$(find godot-bin -type f -name 'Godot*' ! -name '*.dll' ! -name '*.pdb' | head -n 1)"
          chmod +x "$GODOT"
          "$GODOT" --headless --path game --editor --quit

name: build-and-test

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  dotnet:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Restore simulation and tests
        run: dotnet restore Vivarium.sln
      - name: Test simulation
        run: dotnet test Vivarium.sln --configuration Release --no-restore
      - name: Restore Godot C# project
        run: dotnet restore game/Vivarium.csproj
      - name: Compile Godot C# project
        run: dotnet build game/Vivarium.csproj --configuration Release --no-restore
